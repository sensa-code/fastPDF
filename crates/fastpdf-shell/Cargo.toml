[package]
name = "fastpdf-shell"
description = "Windows shell integration plans (per-user .pdf file association)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No dependencies on other platforms: plans are plain data. Only the Windows
# executor (`apply`) talks to the registry.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

[lints]
workspace = true
