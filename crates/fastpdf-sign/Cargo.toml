[package]
name = "fastpdf-sign"
description = "Digital signatures for FastPDF: certificates of the Windows store and CMS signing (ADR 0013, docs/digital-signatures.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# Windows' own certificate stores, smart card stack and CMS encoder do the
# work; nothing else is needed. On other platforms there is nothing to sign
# with.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Time",
] }

[lints]
workspace = true
